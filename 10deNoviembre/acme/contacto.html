
    <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Formulario de contacto</title>
</head>
<body>
  <h1>Datos de contacto</h1>

  <form action="#" method="post">
    <p>
      <label for="nombre">Nombre:</label><br>
      <input type="text" id="nombre" name="nombre" placeholder="Escribe aquí tu nombre:">
    </p>

    <p>
      <label for="apellidos">Apellidos:</label><br>
      <input type="text" id="apellidos" name="apellidos" placeholder="Escribe aquí tu apellido">
    </p>

    <p>
      <label for="email">Correo electrónico:</label><br>
      <input type="email" id="email" name="email" placeholder="Escribe aquí tu correo electrónico. (Ejemplo tucorreo@gmail.com)">
    </p>

    <p>
      <label for="telefono">Teléfono:</label><br>
      <input type="tel" id="telefono" name="telefono">
    </p>

    <p>
      <label for="mensaje">Mensaje:</label><br>
      <textarea id="mensaje" name="mensaje" rows="5" cols="40"></textarea>
    </p>

    <p>
      <input type="submit" value="Enviar">
      <input type="reset" value="Borrar">
    </p>
  </form>

</body>
</html>
